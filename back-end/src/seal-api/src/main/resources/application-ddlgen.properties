# TEMP profile: dump Hibernate-generated DDL from entities to a file for diffing.
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=ddlgen
# Does NOT touch the DB schema (ddl-auto=none) and does NOT bind a fixed port.
spring.jpa.hibernate.ddl-auto=none
server.port=0

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/generated-schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.create-source=metadata
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
